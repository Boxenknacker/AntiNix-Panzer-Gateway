#!/usr/sbin/nft -f
flush ruleset

table inet panzer_gateway {
    chain input {
        type filter hook input priority 0; policy drop;
        iifname "lo" accept
        ct state established,related accept
        iifname "eth1" tcp dport { 4444, 4447, 9040 } accept
        iifname "eth1" udp dport { 53, 67, 5353 } accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy drop;
        oifname "lo" accept
        ct state established,related accept
        oifname "eth0" meta skuid 0 udp sport 68 udp dport 67 accept
        oifname "eth0" meta skuid 107 tcp dport { 80, 443, 9001, 9030 } accept
        oifname "eth0" meta skuid 107 udp dport 1024-65535 accept
        oifname "eth0" meta skuid 107 udp dport { 3478, 19302 } accept
        oifname "eth0" meta skuid 105 tcp dport 1024-65535 accept
        oifname "eth0" meta skuid 105 tcp dport 443 accept
        oifname "eth0" meta skuid 105 udp dport 1024-65535 accept
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;
        iifname "eth1" udp dport 53 redirect to :5353
        iifname "eth1" tcp dport 53 redirect to :5353
        iifname "eth1" tcp dport { 4444, 4447 } return
        iifname "eth1" tcp flags syn redirect to :9040
    }
}
