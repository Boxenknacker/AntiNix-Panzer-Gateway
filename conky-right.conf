
background no
out_to_console no
out_to_stderr no
double_buffer yes
no_buffers yes
update_interval 2.0
conky_init_delay 1

# Ganz nach rechts an den Rand quetschen
alignment top_right
gap_x 25
gap_y 18
minimum_size 320 900
maximum_width 340

border_width 1
cpu_avg_samples 2
default_color white
draw_borders no
draw_graph_borders yes
draw_shades no
net_avg_samples 2

own_window yes
own_window_class Conky
own_window_type override
own_window_transparent no
own_window_colour black
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
use_xft yes
xftfont DejaVu Sans:size=10

TEXT
${font DejaVu Sans:bold:size=16}${alignc}${color #55FE23}NETZWERK-ZENTRALE${color}${font}
${font DejaVu Sans:bold:size=13}${alignc}${color white}Multi-Plug&Play Monitor${color}${font}
${font DejaVu Sans:size=10}${alignc}${color white}Uptime: $uptime${color}${font}
${color #55FE23}${hr 1}${color}
${color #55FE23}WORKSTATION TRAFFIC (eth1):${color}
${color #55FE23}Down:${color} ${downspeed eth1} ${alignr}${color #55FE23}Up:${color} ${upspeed eth1}
${color #1E5616}${downspeedgraph eth1 30,150 1E5616 55FE23} ${alignr}${upspeedgraph eth1 30,150 1E5616 55FE23}${color}
${color #55FE23}Gesamt Down:${color} ${totaldown eth1} ${alignr}${color #55FE23}Gesamt Up:${color} ${totalup eth1}
${color #55FE23}${hr 1}${color}
