background no
out_to_console no
out_to_stderr no
double_buffer yes
no_buffers yes
update_interval 2.0
conky_init_delay 1

# Ganz nach links an den Rand setzen
alignment top_left
gap_x 20
gap_y 18
minimum_size 320 900
maximum_width 340

border_width 1
cpu_avg_samples 2
default_color white
draw_borders no
draw_graph_borders yes
draw_shades no
net_avg_samples 2

own_window yes
own_window_class Conky
own_window_type normal
own_window_transparent no
own_window_colour black
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
use_xft yes
xftfont DejaVu Sans:size=10


TEXT
${font DejaVu Sans:bold:size=16}${alignc}${color #55FE23}AntiNix-Panzer-Gateway${color}${font}
${font DejaVu Sans:bold:size=13}${alignc}${color white}Edition: Ironclad-15.11.26${color}${font}
${font DejaVu Sans:size=10}${alignc}${color white}Uptime: $uptime${color}${font}
${color #55FE23}${hr 1}${color}
CPU Auslastung: ${alignr}$cpu%
Taktfrequenz: ${alignr}$freq_g GHz
Init-System: ${alignr}runit

${color #55FE23}${cpugraph 30,320 55FE23 55FE23}${color}

Festplatte: ${alignr}${fs_used /} / ${fs_size /}
${color #55FE23}${color #55FE23}${fs_bar 6,320 /}${color}${color}

Arbeitsspeicher: ${alignr}$mem / $memmax
Auslagerung (Swap): ${alignr}$swap / $swapmax
${color #55FE23}${hr 1}${color}
${color #55FE23}LIVE-SICHERHEITS-AUDIT:${color}
${font DejaVu Sans:size=11}\
${if_match "${execi 5 pgrep -x tor || sv status tor | grep -q "run" && echo "on" || echo "off"}" != "off"}${color #55FE23}[ OK ] TOR ANONYMISIERUNG LIVE${color}${else}${color red}[ !! ] TOR-NETZWERK DOWN!${color}${endif}
${if_running snowflake-client}${color #00FFFF}[ OK ] TOR-MODUS: SNOWFLAKE BRIDGE${color}${else}${if_running tor}${color #55FE23}[ OK ] TOR-MODUS: DIREKT (STANDARD)${color}${else}${color #FFCC00}[ -- ] TOR-MODUS: STANDBY${color}${endif}${endif}
${if_match "${execi 5 lsmod | grep -q "nft" && echo "on" || echo "off"}" == "on"}${color #55FE23}[ OK ] FIREWALL LEAK-SCHUTZ AKTIV${color}${else}${color red}[ !! ] FIREWALL BLOCKIERT! / UNPROTECTED${color}${endif}
${if_running dnsmasq}${color #55FE23}[ OK ] DHCP-SERVER BEREIT${color}${else}${color red}[ !! ] DHCP-SERVER SCHLÄFT!${color}${endif}
${if_existing /var/lock/antinix-ssh-wizard.lock}${color #55FE23}[ OK ] SSH KRYPTO-KEYS GENERIERT${color}${else}${color #FFCC00}[ !! ] SSH WIZARD BEREIT${color}${endif}
${if_match "${execi 5 ip link show wg0 >/dev/null 2>&1 && echo "on" || echo "off"}" == "on"}${color #55FE23}[ OK ] WIREGUARD VPN AKTIV${color}${else}${color #FFCC00}[ !! ] WIREGUARD REIN OPTIONAL / INAKTIV${color}${endif}
${if_running i2pd-daemon}${color #55FE23}[ OK ] I2P ROUTER AKTIV (PORT 4444/4447)${color}${else}${color #FFCC00}[ !! ] I2P REIN OPTIONAL / INAKTIV${color}${endif}
${if_match "${execi 5 tail -n 20 /var/log/syslog 2>/dev/null | grep -qiE "nftables|block|drop|deny|reject|alert" && echo "alarm" || echo "safe"}" == "safe"}${color #55FE23}[ OK ] INTRUSION DETECTOR: SYSTEM SICHER${color}${else}${color red}[ ALARM ] NFTABLES BLOCK-EVENT ERKANNT!${color}${execi 5 aplay /usr/share/sounds/alsa/Front_Center.wav >/dev/null 2>&1}${endif}\
${font}
